name: Inkwell
summary: Open and edit DOCX, XLSX, CSV, PDF and PPTX. Clean, fast, no ads, no tracking.
description: |
  Inkwell is a clean, fast office app. Open a file, make your change, save it — without losing the parts the app does not edit.

  **Documents (DOCX, TXT, Markdown)** — bold, italic, headings, lists, alignment, find and replace. Images, tables, links, equations and styles are kept when you save. Export to PDF or print.

  **Spreadsheets (XLSX, CSV)** — cell formatting, number and date formats, 50+ formulas (VLOOKUP, XLOOKUP, INDEX/MATCH, SUMIFS, dates, TEXT…), sorting, multiple sheets. Charts and merged cells are kept.

  **PDF** — removable highlights and notes, signatures, form filling, real redaction (blur or black box; the hidden content is removed from the file), rotate/delete/extract pages, merge, search, password-protected files.

  **Presentations (PPTX)** — view and present with speaker notes, edit slide text, export to PDF.

  Undo and redo everywhere, autosaved drafts with crash recovery, folders, thumbnail grid, 22 languages, light and dark theme, an icon that follows your wallpaper. No ads, no tracking, no account.
license: GPL-3.0-or-later
