name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A manual run stores the version in the source first, so tags build the same app (F-Droid builds from tags).
      - name: Store version in source
        if: github.event_name == 'workflow_dispatch'
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$((MA * 10000 + MI * 100 + PA))
          sed -i -E "s/^( *versionCode = )[0-9]+/\1$CODE/; s/^( *versionName = )\"[^\"]*\"/\1\"$VERSION\"/" app/build.gradle.kts
          dir=fastlane/metadata/android/en-US/changelogs
          mkdir -p "$dir"
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md | sed '/^$/d; /^#/d' \
            | awk '{ if (n + length($0) + 1 > 500) exit; print; n += length($0) + 1 }' > "$dir/$CODE.txt"
          git config user.name "ilhanyurek_"
          git config user.email "67053474+ilhanyurek@users.noreply.github.com"
          git add app/build.gradle.kts "$dir/$CODE.txt"
          git diff --cached --quiet || git commit -m "Release $VERSION"
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing. Add the signing secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Core unit tests
        run: ./gradlew :core:test

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Inkwell-${{ steps.version.outputs.version }}.apk"

      # Re-running the same version replaces that release (and moves its tag to this commit).
      - name: Remove existing release of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.version }}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Install"
            echo "1. Download **Inkwell-$VERSION.apk** below to your phone."
            echo "2. Open the file. If asked, allow your browser or file manager to install unknown apps."
            echo "3. If an earlier version is installed, this one updates it and keeps your data."
            echo
            echo "## What's new"
            awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md | sed 's/^### /#### /'
            echo
            echo "Requires Android 8.0 or later."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.sha || github.sha }}
          name: Inkwell ${{ steps.version.outputs.version }}
          files: Inkwell-${{ steps.version.outputs.version }}.apk
          body_path: release-notes.md
