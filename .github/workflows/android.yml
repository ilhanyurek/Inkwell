name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships an Android SDK (ANDROID_HOME) with accepted licenses;
      # AGP downloads any missing platform or build-tools itself.

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Our saved DOCX/XLSX must open in independent libraries with nothing lost.
      - name: Validate saved files with python-docx and openpyxl
        run: |
          pip install --quiet python-docx openpyxl
          python scripts/validate_outputs.py core/build/fixture-out

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build minified release APK
        run: |
          ./gradlew :app:assembleRelease
          ls -l app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkwell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            ./gradlew :app:connectedDebugAndroidTest || touch ui-tests-failed
            ./scripts/smoke_release.sh || touch ui-tests-failed
            adb logcat -d > logcat.txt || true
            test ! -f ui-tests-failed

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/
            logcat.txt
          if-no-files-found: ignore
