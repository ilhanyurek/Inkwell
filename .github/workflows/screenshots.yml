name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Take screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.office.app.StoreScreenshotsTest

      - name: Copy into Fastlane metadata
        run: |
          out=fastlane/metadata/android/en-US/images/phoneScreenshots
          mkdir -p "$out"
          rm -f "$out"/*.png
          for n in 1 2 3 4 5 6 7; do
            f=$(find app/build/outputs/connected_android_test_additional_output -name "store_${n}_*.png" | head -n1)
            test -n "$f"
            cp "$f" "$out/$n.png"
          done
          ls -l "$out"

      - name: Commit
        run: |
          git config user.name "ilhanyurek_"
          git config user.email "67053474+ilhanyurek@users.noreply.github.com"
          git add fastlane/metadata/android/en-US/images/phoneScreenshots
          git diff --cached --quiet || git commit -m "Update store screenshots"
          git push origin HEAD:${{ github.ref_name }}
